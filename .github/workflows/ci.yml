name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          ./godot --headless --version

      - name: Importar proyecto
        run: ./godot --headless --path . --import 2>&1 | tee import.log

      - name: Pruebas de reglas
        run: ./godot --headless --path . --script res://tests/run_tests.gd

      - name: Ejecutar el mundo y la arena (prueba de humo)
        run: |
          ./godot --headless --path . --quit-after 600 2>&1 | tee run.log
          ./godot --headless --path . --quit-after 600 res://scenes/combat_arena.tscn 2>&1 | tee arena.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" import.log run.log arena.log; then
            echo "Se encontraron errores de script."
            exit 1
          fi
